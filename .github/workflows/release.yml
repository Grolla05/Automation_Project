name: Build and Release
on:
  push:
    tags:
      - 'v*' # Dispara quando uma tag começando com 'v' (ex: v1.0.0) é criada

jobs:
  build:
    name: Build & Release Automation
    runs-on: windows-latest # Necessário para compilar executáveis Windows nativos
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller -r backend/requirements.txt

      - name: Build Application Executable
        run: |
          # Aqui você deve colocar o comando exato que gera seu Automation_App.exe
          # Exemplo usando PyInstaller (ajuste conforme seu script principal)
          pyinstaller --noconfirm --onefile --windowed --name "Automation_App" backend/run_desktop.py

      - name: Create Update Bundle (ZIP)
        shell: pwsh
        run: |
          # Prepara a pasta para o ZIP (incluindo o EXE e outros arquivos necessários)
          New-Item -ItemType Directory -Force -Path "dist/bundle"
          Copy-Item "dist/Automation_App.exe" -Destination "dist/bundle/"
          # Adicione aqui outras pastas necessárias (ex: storage/layout se for padrão)
          
          # Compacta o bundle
          Compress-Archive -Path "dist/bundle/*" -DestinationPath "dist/Automation_App.zip"

      - name: Get Version from Tag
        id: get_version
        shell: bash
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Update version.json on Cloud
        shell: bash
        run: |
          # Garante que o version.json local reflete a tag da release
          jq ".version = \"${{ steps.get_version.outputs.VERSION }}\" | .updated_at = \"$(date -u +'%Y-%m-%dT%H:%M:%SZ')\"" version.json > temp.json && mv temp.json version.json
          
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add version.json
          git commit -m "chore: release ${{ github.ref_name }} [skip ci]" || echo "No changes to commit"
          git push origin HEAD:TUV-main

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Automation_App.zip
            version.json
          name: Release ${{ github.ref_name }}
          body: |
            Automatização de Build para a versão ${{ github.ref_name }}.
            Esta release contém o `Automation_App.zip` pronto para o Auto-Updater.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
