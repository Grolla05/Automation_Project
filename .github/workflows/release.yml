name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build & Release Automation
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install JQ and Build Tools
        run: |
          choco install jq -y
          python -m pip install --upgrade pip
          pip install pyinstaller -r backend/requirements.txt

      - name: Build Application Executable
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "Automation_App" backend/run_desktop.py

      - name: Create Update Bundle (ZIP)
        shell: pwsh
        run: |
          if (!(Test-Path "dist/Automation_App.exe")) { 
            Write-Error "Executável não encontrado!"
            exit 1 
          }
          New-Item -ItemType Directory -Force -Path "dist/bundle"
          Copy-Item "dist/Automation_App.exe" -Destination "dist/bundle/"
          Compress-Archive -Path "dist/bundle/*" -DestinationPath "dist/Automation_App.zip"

      - name: Update version.json
        shell: bash
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          if [ ! -f version.json ]; then echo '{"version":"0.0.0"}' > version.json; fi
          jq ".version = \"$VERSION\" | .updated_at = \"$(date -u +'%Y-%m-%dT%H:%M:%SZ')\"" version.json > temp.json && mv temp.json version.json
          
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add version.json
          git commit -m "chore: release $VERSION [skip ci]" || echo "No changes to commit"
          git push origin HEAD:TUV-main

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Automation_App.zip
            version.json
          name: Release ${{ github.ref_name }}
          body: |
            Build automatizado para a versão ${{ github.ref_name }}.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}